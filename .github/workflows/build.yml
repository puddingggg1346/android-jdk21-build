name: Build OpenJDK 21.0.4 for Android aarch64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Install deps
        run: |
          sudo apt update
          sudo apt -y install autoconf zip unzip file wget \
            build-essential libx11-dev libxext-dev libxrender-dev libxrandr-dev \
            libxtst-dev libxt-dev libcups2-dev libfontconfig1-dev libasound2-dev \
            libelf-dev libfreetype6-dev libpng-dev libjpeg-dev libgif-dev \
            systemtap-sdt-dev

      - name: Setup NDK r21e
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
          local-cache: true

      - name: Expose ANDROID_NDK_ROOT
        run: |
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo ">>> NDK path: ${{ steps.setup-ndk.outputs.ndk-path }}"
          ls "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"

      - name: Download freetype + cups
        run: |
          wget -q https://download.savannah.gnu.org/releases/freetype/freetype-2.10.0.tar.gz -O ft.tar.gz
          tar xf ft.tar.gz
          wget -q https://github.com/apple/cups/releases/download/v2.2.4/cups-2.2.4-source.tar.gz
          tar xf cups-2.2.4-source.tar.gz
          rm -f ft.tar.gz cups-2.2.4-source.tar.gz
          ls -d freetype-2.10.0 cups-2.2.4

      - name: Clone JDK 21.0.4
        run: |
          git clone --depth 1 -b jdk-21.0.4+7 https://github.com/openjdk/jdk21u.git openjdk
          cd openjdk
          git log -1 --oneline

      - name: Apply Android patch
        run: |
          cd openjdk
          echo "=== 打原 patch（allow failures）==="
          git apply --reject --whitespace=fix ../patches/jdk21u_android.diff 2>&1 || true
          echo ""
          echo "=== 失败的 reject 文件（不删，需手动修）==="
          find . -name "*.rej" || true
          find . -name "*.orig" -delete
          
          echo ""
          echo "=== 手动修复 flags-cflags.m4 ==="
          python3 -c "
          p='make/autoconf/flags-cflags.m4'
          s=open(p).read()
          old='CFLAGS_OS_DEF_JDK=\"-D_GNU_SOURCE -D_REENTRANT -D_LARGEFILE64_SOURCE\"'
          new='CFLAGS_OS_DEF_JDK=\"-D_GNU_SOURCE -D_REENTRANT -D_LARGEFILE64_SOURCE -D__USE_BSD\"'
          if old in s and '__USE_BSD' not in s:
              s=s.replace(old,new,1)
              open(p,'w').write(s)
              print('patched')
          else:
              print('skip or already')
          "
          grep __USE_BSD make/autoconf/flags-cflags.m4 || echo "WARN: __USE_BSD missing"
          
          echo ""
          echo "=== 手动修复 os_posix.cpp ==="
          python3 -c "
          p='src/hotspot/os/posix/os_posix.cpp'
          s=open(p).read()
          if 'void os::Posix::print_uptime_info(outputStream* st) {\n#ifndef __ANDROID__' not in s:
              s=s.replace(
                'void os::Posix::print_uptime_info(outputStream* st) {\n',
                'void os::Posix::print_uptime_info(outputStream* st) {\n#ifndef __ANDROID__\n',
                1)
              # 找函数体结尾加 #endif
              idx = s.find('void os::Posix::print_uptime_info')
              end_idx = s.find('\n}\n', idx)
              if end_idx > 0:
                  s = s[:end_idx+1] + '#endif\n' + s[end_idx+1:]
              open(p,'w').write(s)
              print('patched')
          else:
              print('already')
          "
          awk '/void os::Posix::print_uptime_info/,/^}/' src/hotspot/os/posix/os_posix.cpp | head -20
          
          echo ""
          echo "=== 清掉 .rej ==="
          find . -name "*.rej" -delete
          echo "done"

      - name: Apply Bionic SHM stubs
        run: bash scripts/apply_android_patches.sh

      - name: Build freetype
        run: |
          export TARGET=aarch64-linux-android TARGET_JDK=aarch64
          cd freetype-2.10.0
          BIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
          export PATH=$BIN:$PATH
          export CC=$BIN/aarch64-linux-android21-clang
          export CXX=$BIN/aarch64-linux-android21-clang++
          export AR=$BIN/llvm-ar RANLIB=$BIN/llvm-ranlib STRIP=$BIN/llvm-strip
          ./configure --host=$TARGET --prefix=$PWD/build_android-arm64 \
            --without-zlib --without-bzip2 --with-png=no --with-harfbuzz=no \
            --disable-shared --enable-static
          make -j4
          make install
          $CC -shared -o build_android-arm64/lib/libfreetype.so objs/*.o -Wl,--allow-shlib-undefined
          ls -la build_android-arm64/lib/

      - name: Build JDK
        run: |
          export TARGET=aarch64-linux-android TARGET_JDK=aarch64
          export JVM_VARIANTS=server JDK_DEBUG_LEVEL=release
          export BOOT_JDK=$JAVA_HOME
          echo "=== BOOT_JDK=$BOOT_JDK ==="
          sed -i 's|^export BOOT_JDK=.*|export BOOT_JDK=$JAVA_HOME|' buildjdk_arm.sh
          echo "=== buildjdk_arm.sh 里 BOOT_JDK 行 ==="
          grep -n "BOOT_JDK" buildjdk_arm.sh | head -3
          echo "=== patch 相关行（应全被注释）==="
          grep -n "git apply\|git reset\|\[CI\]" buildjdk_arm.sh
          echo "=== 开始编译 ==="
          set -o pipefail
          bash buildjdk_arm.sh 2>&1 | tee /tmp/jdk-build.log
          echo "=== 编译退出码: $? ==="

      - name: Upload build log on fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jdk-build-log
          path: /tmp/jdk-build.log
          retention-days: 7

      - name: Package
        run: |
          IMG=$(find openjdk/build -maxdepth 4 -type d -name jdk | head -1)
          echo "IMG=$IMG"
          ls $IMG
          tar czf $GITHUB_WORKSPACE/jre21-aarch64.tar.gz -C $(dirname $IMG) jdk
          ls -lh $GITHUB_WORKSPACE/jre21-aarch64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: jre21-aarch64-jdk21.0.4
          path: jre21-aarch64.tar.gz
          retention-days: 30
