name: Build OpenJDK 21 for Android
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Install deps
        run: |
          sudo apt update
          sudo apt -y install cmake autoconf python3 python-is-python3 unzip zip \
            systemtap-sdt-dev libxtst-dev libasound2-dev libelf-dev \
            libfontconfig1-dev libx11-dev libxext-dev libxrandr-dev \
            libxrender-dev libxt-dev
      - name: Download NDK r21e
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          unzip -q android-ndk-r21e-linux-x86_64.zip
          echo "ANDROID_NDK_ROOT=$PWD/android-ndk-r21e" >> $GITHUB_ENV
      - name: Get sources
        run: |
          bash getlibs.sh
          git clone --depth 1 --branch jdk-21+35 https://github.com/openjdk/jdk.git openjdk
          cd openjdk
          git apply --reject --whitespace=fix ../patches/jdk21u_android.diff || true
          find . -name "*.rej" -delete
          git apply ../android_fixes.patch || true
          cd ..
      - name: Apply Android patches
        run: bash scripts/apply_android_patches.sh
      - name: Fix boot JDK path
        run: |
          sed -i "s|export BOOT_JDK=.*|export BOOT_JDK=$JAVA_HOME|" buildjdk.sh
          grep BOOT_JDK buildjdk.sh
      - name: Build Freetype
        run: |
          export TARGET=aarch64-linux-android TARGET_JDK=aarch64
          cd freetype-2.10.0
          export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          export CC=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          export CXX=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++
          export AR=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          export RANLIB=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
          export STRIP=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          ./configure --host=$TARGET --prefix=$PWD/build_android-arm64 \
            --without-zlib --without-bzip2 --with-png=no --with-harfbuzz=no \
            --disable-shared --enable-static
          make -j4
          make install
          # 手动从 .o 合成 .so（configure 需要）
          CC=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          $CC -shared -o build_android-arm64/lib/libfreetype.so objs/*.o -Wl,--allow-shlib-undefined
          ls -la build_android-arm64/lib/
      - name: Build JDK
        run: |
          export TARGET=aarch64-linux-android TARGET_JDK=aarch64
          export JDK_DEBUG_LEVEL=release
          bash buildjdk.sh
      - name: Package
        run: |
          cd openjdk/build/linux-aarch64-server-release/images
          ls
          tar czf $GITHUB_WORKSPACE/jre21-aarch64.tar.gz jdk
      - uses: actions/upload-artifact@v4
        with:
          name: jre21-aarch64
          path: jre21-aarch64.tar.gz
